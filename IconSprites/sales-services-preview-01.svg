  <!-- Left hand -->
  <circle cx="7.5" cy="9.5" r="1" fill="#0891b2"/>
  <!-- Right arm -->
  <line x1="16" y1="7" x2="10.5" y2="9.5" stroke="#0891b2" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Right hand -->
  <circle cx="10.5" cy="9.5" r="1" fill="#0891b2"/>
