  <line x1="7.5" y1="9.5" x2="10.5" y2="9.5" stroke="#0891b2" stroke-width="0.6" stroke-opacity="0.7"/>
  <!-- Sparkle (AI touch) -->
  <circle cx="15" cy="2" r="0.7" fill="#f9d923"/>
  <line x1="15" y1="0.8" x2="15" y2="3.2" stroke="#f9d923" stroke-width="0.5"/>
