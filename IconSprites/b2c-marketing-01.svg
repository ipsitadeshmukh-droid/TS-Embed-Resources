<svg xmlns="http://www.w3.org/2000/svg">
  <defs>
    <symbol id="rd-icon-spotter" viewBox="0 0 18 18">
      <!-- Outer target circle -->
      <circle cx="9" cy="9.5" r="4.5" fill="none" stroke="#7c3aed" stroke-width="1"/>
      <!-- Middle target circle -->
      <circle cx="9" cy="9.5" r="2.5" fill="none" stroke="#7c3aed" stroke-width="0.8"/>
      <!-- Heart center (B2C engagement) -->
      <!-- Left lobe -->
      <circle cx="7.5" cy="8" r="0.8" fill="#7c3aed"/>
      <!-- Right lobe -->
      <circle cx="10.5" cy="8" r="0.8" fill="#7c3aed"/>
      <!-- Bottom point -->
      <polygon points="7.5,8 10.5,8 9,10.5" fill="#7c3aed"/>
      <!-- Sparkle (AI touch) -->
      <circle cx="15" cy="2" r="0.7" fill="#f9d923"/>
      <line x1="15" y1="0.8" x2="15" y2="3.2" stroke="#f9d923" stroke-width="0.5"/>
      <line x1="13.8" y1="2" x2="16.2" y2="2" stroke="#f9d923" stroke-width="0.5"/>
    </symbol>
  </defs>
</svg>
