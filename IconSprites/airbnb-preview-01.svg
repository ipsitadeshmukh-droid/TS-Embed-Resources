<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18">
  <!-- Roof -->
  <polygon points="9,3.5 2,10 16,10" fill="#FF5A5F" stroke="#c41e3a" stroke-width="0.8"/>
  <!-- House body -->
  <rect x="2" y="10" width="14" height="6" fill="#FF5A5F" stroke="#c41e3a" stroke-width="0.8"/>
  <!-- Left window -->
  <circle cx="4.5" cy="11.5" r="0.5" fill="#fff"/>
  <!-- Right window -->
  <circle cx="13.5" cy="11.5" r="0.5" fill="#fff"/>
  <!-- Door -->
  <rect x="8" y="13" width="2" height="3" rx="0.2" fill="#fff" stroke="#c41e3a" stroke-width="0.6"/>
  <!-- Door knob -->
  <circle cx="9.5" cy="13.8" r="0.15" fill="#c41e3a"/>
  <!-- Sparkle (AI touch) -->
  <circle cx="15" cy="2" r="0.7" fill="#f9d923"/>
  <line x1="15" y1="0.8" x2="15" y2="3.2" stroke="#f9d923" stroke-width="0.5"/>
  <line x1="13.8" y1="2" x2="16.2" y2="2" stroke="#f9d923" stroke-width="0.5"/>
</svg>
