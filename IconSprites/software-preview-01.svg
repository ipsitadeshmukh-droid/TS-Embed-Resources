<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18">
  <!-- Monitor frame -->
  <rect x="2" y="3" width="14" height="9" rx="1.5" fill="#4f46e5" stroke="#3730a3" stroke-width="0.8"/>
  <!-- Screen area -->
  <rect x="3.5" y="4.5" width="11" height="6" rx="0.5" fill="#ede9fe"/>
  <!-- Code lines -->
  <line x1="5" y1="6.3" x2="9.5" y2="6.3" stroke="#4f46e5" stroke-width="0.7"/>
  <line x1="5" y1="8" x2="12" y2="8" stroke="#4f46e5" stroke-width="0.7"/>
  <line x1="5" y1="9.7" x2="8" y2="9.7" stroke="#7c3aed" stroke-width="0.7"/>
  <!-- Stand -->
  <rect x="7.5" y="12" width="3" height="1.5" rx="0.3" fill="#6366f1" stroke="#3730a3" stroke-width="0.5"/>
  <!-- Base -->
  <rect x="6" y="13.5" width="6" height="1" rx="0.5" fill="#6366f1" stroke="#3730a3" stroke-width="0.5"/>
  <!-- Sparkle (AI touch) -->
  <circle cx="15" cy="2" r="0.7" fill="#f9d923"/>
  <line x1="15" y1="0.8" x2="15" y2="3.2" stroke="#f9d923" stroke-width="0.5"/>
  <line x1="13.8" y1="2" x2="16.2" y2="2" stroke="#f9d923" stroke-width="0.5"/>
</svg>
