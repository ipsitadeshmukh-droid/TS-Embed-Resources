<svg xmlns="http://www.w3.org/2000/svg">
  <defs>
    <symbol id="rd-icon-spotter" viewBox="0 0 18 18">
      <!-- Bank base (foundation) -->
      <rect x="0.5" y="15.5" width="17" height="2" rx="0.3" fill="#1e3a8a"/>
      <!-- Column platform -->
      <rect x="2" y="13" width="14" height="2.5" fill="#dbeafe" stroke="#1e3a8a" stroke-width="0.8"/>
      <!-- Column 1 -->
      <rect x="4" y="8.5" width="1.5" height="4.5" fill="#f0f4ff" stroke="#1e3a8a" stroke-width="0.8"/>
      <!-- Column 2 -->
      <rect x="8.25" y="8.5" width="1.5" height="4.5" fill="#f0f4ff" stroke="#1e3a8a" stroke-width="0.8"/>
      <!-- Column 3 -->
      <rect x="12.5" y="8.5" width="1.5" height="4.5" fill="#f0f4ff" stroke="#1e3a8a" stroke-width="0.8"/>
      <!-- Entablature -->
      <rect x="2" y="7.5" width="14" height="1" fill="#1e3a8a"/>
      <!-- Pediment -->
      <polygon points="9,3.5 2,7.5 16,7.5" fill="#dbeafe" stroke="#1e3a8a" stroke-width="0.8"/>
      <!-- Sparkle (AI touch) -->
      <circle cx="15" cy="2" r="0.7" fill="#f9d923"/>
      <line x1="15" y1="0.8" x2="15" y2="3.2" stroke="#f9d923" stroke-width="0.5"/>
      <line x1="13.8" y1="2" x2="16.2" y2="2" stroke="#f9d923" stroke-width="0.5"/>
    </symbol>
  </defs>
</svg>
